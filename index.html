<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit Engine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Drum Kit Engine</h1>

        <section class="drum-kit" aria-label="Drum kit">
            <button
                type="button"
                class="drum-pad"
                data-key="a"
                data-sound="sounds/kick.wav"
            >
                A - Kick
            </button>

            <button
                type="button"
                class="drum-pad"
                data-key="s"
                data-sound="sounds/snare.wav"
            >
                S - Snare
            </button>

            <button
                type="button"
                class="drum-pad"
                data-key="d"
                data-sound="sounds/hihat.wav"
            >
                D - Hi-Hat
            </button>

            <button
                type="button"
                class="drum-pad"
                data-key="f"
                data-sound="sounds/clap.wav"
            >
                F - Clap
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
